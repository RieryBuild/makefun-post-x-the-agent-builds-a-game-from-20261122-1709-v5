<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MOON MOTH — catch the moon-petals</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0620;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* MOON MOTH — a glowing moth catches drifting moon-petals and dodges shadow bats.
   Built from one prompt. Move: Arrow keys / A D, mouse, or touch drag.
   Space / click / tap: start, restart. */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
let SCALE = 1, OX = 0, OY = 0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  SCALE = Math.min(cv.width / W, cv.height / H);
  OX = (cv.width - W * SCALE) / 2;
  OY = (cv.height - H * SCALE) / 2;
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;

// ---------- state ----------
const G = {
  state: 'title',           // title | playing | over
  score: 0, best: 0, lives: 3,
  time: 0, playTime: 0,
  mothX: W/2, mothTarget: W/2, mothVX: 0,
  petals: [], bats: [], sparks: [], floats: [],
  stars: [], fireflies: [], flowers: [],
  spawnPetal: 0, spawnBat: 0, invuln: 0, flash: 0, shake: 0,
  keys: {},
};
try { G.best = parseInt(localStorage.getItem('moonmoth-best') || '0', 10) || 0; } catch(e){}
window.__game = G;
G.start = start; G.flap = start; // alias so generic drivers can start/restart
G.moveTo = (x)=>{ G.mothTarget = clamp(x, 70, W-70); };

for (let i=0;i<130;i++) G.stars.push({x:rand(0,W), y:rand(0,H*0.62), r:rand(0.8,2.6), tw:rand(0,TAU), sp:rand(0.4,1.6)});
for (let i=0;i<26;i++) G.fireflies.push({x:rand(0,W), y:rand(H*0.35,H*0.95), r:rand(2,4.5), ph:rand(0,TAU), sp:rand(0.2,0.7), vx:rand(-14,14)});
for (let i=0;i<34;i++){
  const x = rand(0,W);
  G.flowers.push({x, h:rand(70,190), hue: Math.random()<0.5?'#ff5ea8':'#37e6ff', ph:rand(0,TAU), sway:rand(4,12)});
}

function start(){
  if (G.state === 'playing') return;
  G.state = 'playing'; G.score = 0; G.lives = 3; G.playTime = 0;
  G.petals = []; G.bats = []; G.sparks = []; G.floats = [];
  G.mothX = W/2; G.mothTarget = W/2; G.invuln = 0; G.flash = 0;
  G.spawnPetal = 0; G.spawnBat = 1.2;
  // pre-seed the sky so the first seconds already have petals to chase
  for (let i=0;i<3;i++){
    spawnPetal();
    const p = G.petals[G.petals.length-1];
    p.y = rand(200, 1100);
  }
}
function gameOver(){
  G.state = 'over';
  if (G.score > G.best){ G.best = G.score; try{ localStorage.setItem('moonmoth-best', String(G.best)); }catch(e){} }
  G.shake = 14;
}
function speed(){ return 1 + Math.min(G.score * 0.045, 1.1); } // garden speeds up as you score
function spawnPetal(){
  G.petals.push({x:rand(60,W-60), y:-40, vy:rand(150,230)*speed(), sway:rand(30,80), ph:rand(0,TAU),
    r:rand(20,28), hue: Math.random()<0.6?'#ff8fd0':'#ffe9f7', rot:rand(-0.4,0.4)});
}
function spawnBat(){
  const side = Math.random()<0.5 ? -1 : 1;
  G.bats.push({x:rand(70,W-70), y:-50, vy:rand(260,360)*speed(), vx:rand(20,60)*side,
    flap:rand(0,TAU), s:rand(0.85,1.25), r:34});
}
function burst(x,y,color,n){
  for (let i=0;i<n;i++){
    const a = rand(0,TAU), sp = rand(60,260);
    G.sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:rand(0.4,0.9),t:0,color,r:rand(2,5)});
  }
}
function floatText(x,y,text,color){ G.floats.push({x,y,text,color,t:0,life:1.1}); }

// ---------- input ----------
addEventListener('keydown', (e)=>{
  if (e.key===' '||e.key==='Enter'){ e.preventDefault(); start(); return; }
  G.keys[e.key.toLowerCase()] = true;
  if (['arrowleft','arrowright','a','d'].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', (e)=>{ G.keys[e.key.toLowerCase()] = false; });
function pointerX(e){
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  return (cx - r.left) / r.width * W;
}
cv.addEventListener('pointerdown', (e)=>{ if (G.state!=='playing'){ start(); } else G.moveTo(pointerX(e)); });
cv.addEventListener('pointermove', (e)=>{ if (G.state==='playing') G.moveTo(pointerX(e)); });
cv.addEventListener('touchmove', (e)=>{ e.preventDefault(); if (G.state==='playing') G.moveTo(pointerX(e)); }, {passive:false});

// ---------- update ----------
function update(dt){
  G.time += dt;
  if (G.state !== 'playing'){ G.flash = Math.max(0, G.flash - dt); G.shake = Math.max(0, G.shake - dt*30); return; }
  G.playTime += dt;
  G.invuln = Math.max(0, G.invuln - dt);
  G.flash = Math.max(0, G.flash - dt);
  G.shake = Math.max(0, G.shake - dt*30);

  // keyboard steering
  const kb = (G.keys['arrowleft']||G.keys['a'] ? -1:0) + (G.keys['arrowright']||G.keys['d'] ? 1:0);
  if (kb) G.mothTarget = clamp(G.mothTarget + kb*620*dt, 70, W-70);
  const dx = G.mothTarget - G.mothX;
  G.mothVX = dx * 10;
  G.mothX += dx * Math.min(1, dt*12);
  G.mothX = clamp(G.mothX, 70, W-70);

  // spawns — petals plentiful, bats rarer and later
  G.spawnPetal -= dt;
  if (G.spawnPetal <= 0){ spawnPetal(); G.spawnPetal = Math.max(0.38, 0.8 - G.score*0.02) * rand(0.8,1.2); }
  G.spawnBat -= dt;
  if (G.spawnBat <= 0 && G.playTime > 4){
    spawnBat();
    G.spawnBat = Math.max(1.15, 2.6 - G.score*0.035) * rand(0.85,1.25);
  }

  const mothY = H*0.78 + Math.sin(G.time*2.2)*10;
  // petals
  for (let i=G.petals.length-1;i>=0;i--){
    const p = G.petals[i];
    p.y += p.vy*dt; p.ph += dt*2; p.x += Math.sin(p.ph)*p.sway*dt;
    if (p.y > H+60){ G.petals.splice(i,1); continue; }
    const ddx = p.x-G.mothX, ddy = p.y-mothY;
    if (ddx*ddx+ddy*ddy < (p.r+52)*(p.r+52)){
      G.petals.splice(i,1);
      G.score++;
      burst(p.x, p.y, p.hue, 14);
      floatText(p.x, p.y-30, '+1', '#ffe9f7');
    }
  }
  // bats
  for (let i=G.bats.length-1;i>=0;i--){
    const b = G.bats[i];
    b.y += b.vy*dt; b.x += b.vx*dt + Math.sin(G.time*3+b.flap)*30*dt; b.flap += dt*14;
    if (b.x < 50) b.vx = Math.abs(b.vx); if (b.x > W-50) b.vx = -Math.abs(b.vx);
    if (b.y > H+80){ G.bats.splice(i,1); continue; }
    const ddx = b.x-G.mothX, ddy = b.y-mothY;
    if (G.invuln<=0 && ddx*ddx+ddy*ddy < (b.r+46)*(b.r+46)){
      G.bats.splice(i,1);
      G.lives--; G.invuln = 1.6; G.flash = 0.35; G.shake = 12;
      burst(G.mothX, mothY, '#ff3b6b', 22);
      floatText(G.mothX, mothY-70, G.lives>0 ? 'OUCH!' : '', '#ff5e7a');
      if (G.lives <= 0) gameOver();
    }
  }
  // sparks + floats
  for (let i=G.sparks.length-1;i>=0;i--){
    const s = G.sparks[i]; s.t += dt;
    if (s.t>=s.life){ G.sparks.splice(i,1); continue; }
    s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 300*dt;
  }
  for (let i=G.floats.length-1;i>=0;i--){
    const f = G.floats[i]; f.t += dt; f.y -= 46*dt;
    if (f.t>=f.life) G.floats.splice(i,1);
  }
  for (const f of G.fireflies){ f.x += f.vx*dt + Math.sin(G.time*f.sp+f.ph)*12*dt; f.y += Math.cos(G.time*0.7+f.ph)*10*dt; }
}

// ---------- drawing ----------
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#150b3d'); g.addColorStop(0.45,'#2a1158'); g.addColorStop(0.8,'#4a1a6e'); g.addColorStop(1,'#12082a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // moon + halo
  const mx = W*0.78, my = H*0.16;
  const halo = ctx.createRadialGradient(mx,my,10,mx,my,260);
  halo.addColorStop(0,'rgba(255,244,214,0.55)'); halo.addColorStop(0.4,'rgba(255,244,214,0.12)'); halo.addColorStop(1,'rgba(255,244,214,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx,my,260,0,TAU); ctx.fill();
  const mg = ctx.createRadialGradient(mx-28,my-30,10,mx,my,110);
  mg.addColorStop(0,'#fffbe8'); mg.addColorStop(0.7,'#ffeec2'); mg.addColorStop(1,'#f2d488');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx,my,104,0,TAU); ctx.fill();
  ctx.fillStyle = 'rgba(214,178,110,0.5)';
  for (const [cx,cy,cr] of [[mx-38,my-18,16],[mx+30,my+28,12],[mx+8,my-44,9],[mx+44,my-30,7]]){
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,TAU); ctx.fill();
  }
  // stars
  for (const s of G.stars){
    ctx.globalAlpha = 0.35 + 0.65*Math.abs(Math.sin(G.time*s.sp+s.tw));
    ctx.fillStyle = '#cfe8ff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // distant hills
  ctx.fillStyle = '#1c0f3e';
  ctx.beginPath(); ctx.moveTo(0,H*0.86);
  for (let x=0;x<=W;x+=60) ctx.lineTo(x, H*0.86 - Math.sin(x*0.006+1.2)*46 - 20);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // fireflies
  for (const f of G.fireflies){
    const a = 0.25 + 0.6*Math.abs(Math.sin(G.time*1.4+f.ph));
    ctx.globalAlpha = a; ctx.fillStyle = '#aef7c9';
    ctx.shadowColor = '#7dffb0'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  // garden floor + glowing flowers
  const fg = ctx.createLinearGradient(0,H*0.9,0,H);
  fg.addColorStop(0,'#241040'); fg.addColorStop(1,'#0d061f');
  ctx.fillStyle = fg; ctx.fillRect(0,H*0.9,W,H*0.1);
  for (const fl of G.flowers){
    const sway = Math.sin(G.time*1.1+fl.ph)*fl.sway;
    const bx = fl.x + sway, by = H*0.97, top = by - fl.h;
    ctx.strokeStyle = '#2f7d4f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fl.x,by); ctx.quadraticCurveTo(fl.x+sway*0.4, by-fl.h*0.6, bx, top); ctx.stroke();
    ctx.fillStyle = fl.hue; ctx.shadowColor = fl.hue; ctx.shadowBlur = 16;
    for (let k=0;k<5;k++){
      const a = k/5*TAU + fl.ph;
      ctx.beginPath(); ctx.ellipse(bx+Math.cos(a)*11, top+Math.sin(a)*11, 9, 6, a, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(bx,top,7,0,TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;
}
function drawPetal(p){
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot + Math.sin(p.ph)*0.3);
  ctx.shadowColor = p.hue; ctx.shadowBlur = 26;
  const g = ctx.createRadialGradient(0,-6,2,0,0,p.r+8);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.45,p.hue); g.addColorStop(1,'rgba(255,94,168,0.15)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0,-p.r);
  ctx.bezierCurveTo(p.r*0.95,-p.r*0.4, p.r*0.7,p.r*0.8, 0,p.r);
  ctx.bezierCurveTo(-p.r*0.7,p.r*0.8, -p.r*0.95,-p.r*0.4, 0,-p.r);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,-p.r*0.7); ctx.quadraticCurveTo(3,p.r*0.3,0,p.r*0.85); ctx.stroke();
  ctx.restore();
}
function drawBat(b){
  ctx.save(); ctx.translate(b.x,b.y); ctx.scale(b.s,b.s);
  const flap = Math.sin(b.flap)*0.9;
  ctx.fillStyle = '#241040';
  ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 3; // violet rim so the bat reads on the dark sky
  ctx.shadowColor = '#8b5cf6'; ctx.shadowBlur = 16;
  // wings
  for (const s of [-1,1]){
    ctx.save(); ctx.scale(s,1); ctx.rotate(-flap*0.5);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(34,-34-flap*22, 66,-18);
    ctx.quadraticCurveTo(48,2, 40,10);
    ctx.quadraticCurveTo(28,-2, 14,8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // body + ears + eyes
  ctx.beginPath(); ctx.ellipse(0,4,15,19,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-11,-8); ctx.lineTo(-6,-24); ctx.lineTo(-1,-9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(11,-8); ctx.lineTo(6,-24); ctx.lineTo(1,-9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff2e4d'; ctx.shadowColor = '#ff2e4d'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(-6,0,4.5,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6,0,4.5,0,TAU); ctx.fill();
  ctx.restore();
}
function drawMoth(){
  const bob = Math.sin(G.time*2.2)*10;
  const y = H*0.78 + bob;
  const x = G.mothX;
  const tilt = clamp(G.mothVX*0.0009, -0.28, 0.28);
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
  if (G.invuln>0 && Math.floor(G.time*12)%2===0) ctx.globalAlpha = 0.35;
  const flap = Math.sin(G.time*16)*0.55;
  // glow
  ctx.shadowColor = '#37e6ff'; ctx.shadowBlur = 42;
  // wings — big luminous upper + lower wings, cyan fading to pink
  for (const s of [-1,1]){
    ctx.save(); ctx.scale(s,1); ctx.rotate(-flap*0.35);
    let wg = ctx.createLinearGradient(0,-10, 95, -70);
    wg.addColorStop(0,'rgba(55,230,255,0.95)'); wg.addColorStop(0.6,'rgba(120,140,255,0.9)'); wg.addColorStop(1,'rgba(255,94,168,0.85)');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(6,-6);
    ctx.bezierCurveTo(55,-78, 118,-66, 104,-16);
    ctx.bezierCurveTo(96,6, 46,10, 6,2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2.5; ctx.stroke();
    // wing spots
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(66,-38,10,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(84,-28,6,0,TAU); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.scale(s,1); ctx.rotate(flap*0.3);
    let lg = ctx.createLinearGradient(0,4, 70, 60);
    lg.addColorStop(0,'rgba(255,94,168,0.9)'); lg.addColorStop(1,'rgba(120,90,255,0.75)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(4,4);
    ctx.bezierCurveTo(44,22, 78,44, 62,72);
    ctx.bezierCurveTo(40,66, 12,40, 4,12);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  // antennae
  ctx.strokeStyle = '#dfe9ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const s of [-1,1]){
    ctx.beginPath(); ctx.moveTo(s*8,-34);
    ctx.quadraticCurveTo(s*22,-66, s*34,-72); ctx.stroke();
    ctx.fillStyle = '#ffe9f7'; ctx.shadowColor = '#ff8fd0'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(s*34,-72,7,0,TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;
  // fuzzy body
  const bg = ctx.createLinearGradient(0,-40,0,44);
  bg.addColorStop(0,'#3b2a63'); bg.addColorStop(0.5,'#241640'); bg.addColorStop(1,'#120a26');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0,2,17,44,0,0,TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,233,247,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0,2,17,44,0,0,TAU); ctx.stroke();
  // face + eyes
  ctx.fillStyle = '#1b1030';
  ctx.beginPath(); ctx.arc(0,-30,15,0,TAU); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-6,-32,5.5,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6,-32,5.5,0,TAU); ctx.fill();
  ctx.fillStyle = '#14092b';
  ctx.beginPath(); ctx.arc(-5,-32,2.8,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-32,2.8,0,TAU); ctx.fill();
  ctx.restore();
}
function drawHUD(){
  // score — big, top centre
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = '#37e6ff'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 120px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(String(G.score), W/2, 190);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(207,232,255,0.85)';
  ctx.font = '700 34px system-ui, sans-serif';
  ctx.fillText('S C O R E', W/2, 246);
  // lives — moth hearts, top left
  for (let i=0;i<3;i++){
    const x = 70 + i*64, y = 110;
    ctx.save(); ctx.translate(x,y);
    ctx.globalAlpha = i < G.lives ? 1 : 0.22;
    ctx.fillStyle = '#ff5e7a'; ctx.shadowColor = '#ff5e7a'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0,14);
    ctx.bezierCurveTo(-26,-8, -14,-26, 0,-12);
    ctx.bezierCurveTo(14,-26, 26,-8, 0,14);
    ctx.fill();
    ctx.restore();
  }
  // best
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(207,232,255,0.8)';
  ctx.font = '700 30px system-ui, sans-serif';
  ctx.fillText('BEST ' + G.best, W-56, 120);
  ctx.restore();
}
function drawOverlay(title, sub, cta){
  ctx.fillStyle = 'rgba(11,6,32,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.textAlign = 'center';
  ctx.shadowColor = '#ff5ea8'; ctx.shadowBlur = 34;
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 118px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(title, W/2, H*0.40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#cfe8ff';
  ctx.font = '500 40px system-ui, sans-serif';
  const lines = sub.split('\n');
  lines.forEach((ln,i)=> ctx.fillText(ln, W/2, H*0.40 + 70 + i*56));
  // CTA pill
  const tw = ctx.measureText(cta).width;
  ctx.font = '800 40px system-ui, sans-serif';
  const pw = ctx.measureText(cta).width + 72;
  const px = W/2 - pw/2, py = H*0.40 + 70 + lines.length*56 + 44;
  const pg = ctx.createLinearGradient(px,py,px+pw,py);
  pg.addColorStop(0,'#37e6ff'); pg.addColorStop(1,'#ff5ea8');
  ctx.fillStyle = pg; roundRect(px,py,pw,84,42); ctx.fill();
  ctx.fillStyle = '#12082a';
  ctx.fillText(cta, W/2, py+56);
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#0b0620'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SCALE,0,0,SCALE,OX,OY);
  if (G.shake>0) ctx.translate(rand(-G.shake,G.shake)*0.5, rand(-G.shake,G.shake)*0.5);
  drawBackground();
  for (const p of G.petals) drawPetal(p);
  for (const b of G.bats) drawBat(b);
  if (G.state !== 'title') drawMoth();
  for (const s of G.sparks){
    ctx.globalAlpha = 1 - s.t/s.life;
    ctx.fillStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  for (const f of G.floats){
    ctx.globalAlpha = 1 - f.t/f.life;
    ctx.fillStyle = f.color; ctx.font = '800 44px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (G.state !== 'title') drawHUD();
  if (G.flash>0){ ctx.fillStyle = `rgba(255,46,77,${G.flash*0.55})`; ctx.fillRect(0,0,W,H); }
  if (G.state === 'title'){
    drawOverlay('MOON MOTH', 'catch the glowing moon-petals\ndodge the shadow bats · 3 lives', 'TAP OR PRESS SPACE');
    // show the moth on the title screen, floating above the CTA
    ctx.save(); ctx.translate(W/2, H*0.62); ctx.scale(1.35,1.35); ctx.translate(-W/2, -H*0.78);
    drawMoth(); ctx.restore();
  }
  if (G.state === 'over'){
    drawOverlay('GAME OVER', 'score  ' + G.score + '   ·   best  ' + G.best + '\nthe garden keeps glowing…', 'PLAY AGAIN');
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
